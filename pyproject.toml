[build-system]
# >=77 for PEP 639 support (`license` as an SPDX string + `license-files`).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clide-tui"
version = "1.1.0"
description = "Clide - Your Friendly Terminal IDE"
readme = "README.md"
requires-python = ">=3.10"
# The `syntax` extra pulls in tree-sitter; without it TextArea silently falls
# back to plain text and no highlighting happens at all.
dependencies = ["textual[syntax]>=8.2"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joel Ogofe Tanko", email = "7thogofe@gmail.com" }]
keywords = ["ide", "editor", "terminal", "tui", "textual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Text Editors",
    "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://github.com/ogofe/clide"
Issues = "https://github.com/ogofe/clide/issues"
Author = "https://jtogofe.vercel.app"

[project.scripts]
clide = "clide.cli:main"

[tool.setuptools]
# Listed explicitly so the local venv/ is never mistaken for a package.
packages = ["clide", "clide.components"]

[tool.setuptools.package-data]
clide = ["*.tcss"]
